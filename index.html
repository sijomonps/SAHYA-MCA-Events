<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Department of MCA Events - Marian College Kuttikkanam. Join us for Titanium Strike Arena, Cydata, and Cyfusion.">
    <title>Sahya Fest - MCA Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <header class="hero-section">
            <div class="image-wrapper">
                <img src="assets/hero_image.png" alt="Cyborg Theme Poster" class="hero-img">
                <div class="overlay-gradient"></div>
            </div>
            <div class="header-content">
                <p class="subtitle">Department of MCA</p>
                <h1 class="main-title">SAHYA NOCTURNA</h1>
            </div>
        </header>

        <!-- Prize Pool Section -->
        <section class="prize-pool-section">
            <div class="prize-content">
                <span class="prize-label">TOTAL PRIZE POOL</span>
                <div class="prize-amount-wrapper">
                    <span class="currency">₹</span>
                    <span class="counter" data-target="30000">0</span>
                    <span class="plus">+</span>
                </div>
            </div>
            <div class="glow-effect"></div>
        </section>

        <section class="events-list">
            <a href="https://sahyafest.in/events/6926a20503c0a932cf278912" target="_blank" class="event-card titanium">
                <div class="card-content">
                    <span class="event-category">Gaming</span>
                    <h2>TITANIUM STRIKE ARENA</h2>
                    <div class="card-arrow">→</div>
                </div>
                <div class="card-bg"></div>
            </a>

            <a href="https://sahyafest.in/events/692699f11b2ce3f5062f7007" target="_blank" class="event-card cydata">
                <div class="card-content">
                    <span class="event-category">Technical</span>
                    <h2>CYDATA</h2>
                    <div class="card-arrow">→</div>
                </div>
                <div class="card-bg"></div>
            </a>

            <a href="https://sahyafest.in/events/692691fa1b2ce3f5062f62d2" target="_blank" class="event-card cyfusion">
                <div class="card-content">
                    <span class="event-category">Workshop</span>
                    <h2>CYFUSION</h2>
                    <div class="card-arrow">→</div>
                </div>
                <div class="card-bg"></div>
            </a>
        </section>

        <!-- Contact Section -->
        <section class="contact-section">
            <h3 class="section-title">Contact Us</h3>
            <div class="contact-grid">
                <div class="contact-card">
                    <span class="role">Student Coordinator</span>
                    <p class="name">Asni Ansari</p>
                    <a href="tel:8547934602" class="phone">8547934602</a>
                </div>
                <div class="contact-card">
                    <span class="role">Faculty Coordinator</span>
                    <p class="name">Satheesh Kumar</p>
                    <a href="tel:9400755768" class="phone">9400755768</a>
                </div>
            </div>
        </section>

        <footer class="site-footer">
            <p>Marian College Kuttikkanam (Autonomous)</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
